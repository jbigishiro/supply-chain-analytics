version: 2

models:
  - name: dim_date
    description: One row per calendar day, Sep 2016 – Dec 2018.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_customers
    description: One row per person (customer_unique_id), with latest address, coordinates, and order history.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: One row per product, with English category name and package size.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_name
        data_tests: [not_null]

  - name: dim_sellers
    description: One row per seller, with location and coordinates.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: fact_orders
    description: One row per order. Delivery metrics are NULL unless delivered; stage durations are NULL unless the timeline is valid.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_order_items
    description: One row per item in an order, with seller–customer distance.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id