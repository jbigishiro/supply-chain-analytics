version: 2

models:
  - name: ml_late_delivery_features
    description: One row per delivered order with features known at approval time and the target is_late. No post-approval information is used.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: is_late
        data_tests: [not_null]

  - name: ml_weekly_demand
    description: Weekly orders placed (excluding canceled/unavailable) for all orders and the top 5 categories. Complete weeks only, 2017-01-02 to 2018-08-20.
    columns:
      - name: series_week_key
        data_tests: [unique, not_null]
      - name: orders
        data_tests: [not_null]